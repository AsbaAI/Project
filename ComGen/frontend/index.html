<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>ComGen</title>
    <meta
      name="description"
      content="Génération de communications de service — courriel, intranet, bannière, Teams — à partir d’une note technique."
    />

    <!--
      Le thème est posé AVANT le premier rendu. Sans cela, une page
      ouverte en thème sombre s'affiche un instant en clair : un éclair
      blanc que l'on remarque à chaque navigation.

      La clé doit rester identique à THEME_STORAGE_KEY (src/lib/theme.ts).
    -->
    <script>
      try {
        var choix = localStorage.getItem('comgen:theme')
        if (choix === 'light' || choix === 'dark') {
          document.documentElement.dataset.theme = choix
          document.documentElement.style.colorScheme = choix
        }
      } catch (e) {
        /* Stockage indisponible : les media queries prennent le relais. */
      }
    </script>

    <!-- Le navigateur ouvre la connexion aux fontes avant d'avoir lu le
         CSS qui les demande. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
